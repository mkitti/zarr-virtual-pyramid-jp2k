[workspace]
name = "zarr-virtual-pyramid-jp2k"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.12.*"
numpy = ">=2.5.3"
zarr = ">=3.4"
imagecodecs = "*"
ml_dtypes = "*"
openjph = ">=0.32.0,<0.33"
openjpeg = ">=2.5.4,<3"
ome-zarr-models = ">=1.8.1,<2"
fsspec = ">=2026.9.0,<2027"
aiohttp = ">=3.14.5,<4"

[activation.env]
# local refkv clone (pure-Python package plus its compiled refkv._core)
PYTHONPATH = "C:/Users/kittisopikulm/src/refkv/python/src"

[pypi-dependencies]
imagecodecs-zarr = ">=2026.10.10, <2027"
nd-image-codecs = { version = ">=0.2.5, <0.3", extras = ["zarr"] }

# Toolchain for building nd-image-codecs' WebAssembly (used for the Neuroglancer codecs); `pixi run -e wasm ...`
[feature.wasm.dependencies]
rust = "*"
rust-std-wasm32-unknown-unknown = "*"
wasm-pack = "*"
wasm-bindgen-cli = "==0.2.126"
binaryen = "*"

[environments]
wasm = { features = ["wasm"], no-default-feature = true }
